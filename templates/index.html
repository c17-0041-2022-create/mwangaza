<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mwangaza RentLedger – Landing</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">
  <div class="flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-md py-4 fixed w-full top-0 z-50">
      <div class="container mx-auto px-4 flex items-center justify-between">
        <div class="text-2xl font-semibold text-gray-800">Mwangaza</div>
        <div class="space-x-4">
          <a href="{{ url_for('auth.login') }}" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-md transition duration-300">Sign In</a>
          <a href="{{ url_for('auth.register') }}" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-semibold transition duration-300">Get Started</a>
        </div>
      </div>
    </header>

    <!-- Hero Section -->
    <main class="flex-grow flex items-center justify-center">
      <div class="flex flex-col md:flex-row items-center justify-between w-full px-6 mt-24 max-w-6xl mx-auto gap-10">
        <!-- Text Content -->
        <div class="text-center md:text-left md:w-1/2">
          <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-6 leading-tight">Pay Rent with Ease —<br>Instant. Secure. Smart.</h1>
          <p class="text-lg md:text-xl text-gray-700 max-w-lg mb-10">Mwangaza makes rent payments simple with Lightning-fast transfers and automated KRA tax filing for landlords in Kenya.</p>
          <a href="/tenant" class="inline-block px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-lg shadow-lg transition duration-300">Launch App</a>
        </div>

        <!-- Image -->
        <div class="md:w-1/2 flex justify-center">
          <img src="{{ url_for('static', filename='images/Mwangaza5.jpg') }}" alt="Rent Image">
        </div>
      </div>
    </main>
    <!-- Footer -->
    <footer class="bg-gray-200 py-6 text-center">
      <div class="container mx-auto px-4 grid grid-cols-1 sm:grid-cols-3 gap-4 text-gray-700 text-sm font-medium">
        <div class="flex justify-center items-center space-x-2"><i class="fa-solid fa-bolt text-yellow-500"></i><span>Powered by Bitcoin Lightning</span></div>
        <div class="flex justify-center items-center space-x-2"><i class="fa-solid fa-file-invoice-dollar text-green-600"></i><span>Automated Tax Filing</span></div>
        <div class="flex justify-center items-center space-x-2"><i class="fa-solid fa-coins text-blue-600"></i><span>KES 10M+ Processed</span></div>
      </div>
    </footer>
  </div>
</body>
</html>
