{% extends 'landlord_base.html' %}

{% block content %}
  <div class="max-w-3xl mx-auto mt-8">
    <h2 class="text-2xl font-semibold mb-4">Withdraw Funds</h2>

    <div class="bg-white shadow rounded p-4 mb-6">
      <p class="text-sm text-gray-600">Available balance:</p>
      <p class="text-3xl font-bold">KES {{ '%.2f'|format(available) }}</p>
    </div>

    <form method="post" class="space-y-4 bg-white shadow rounded p-6">
      <input type="hidden" name="available" value="{{ available }}" />

      <div>
        <label class="block text-sm font-medium text-gray-700">Amount to withdraw (KES)</label>
        <input name="amount" type="number" step="0.01" min="0" max="{{ available }}" value="{{ '%.2f'|format(available) }}" required class="mt-1 block w-full rounded border-gray-300" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">KRA PIN</label>
        <input name="kra_pin" type="text" placeholder="A000000000L" class="mt-1 block w-full rounded border-gray-300" />
      </div>

      <div class="border-t pt-4">
        <label class="inline-flex items-center">
          <input type="checkbox" name="withdraw_to_mpesa" value="1" class="form-checkbox mr-2" />
          <span class="text-sm">Send net amount straight to M-Pesa</span>
        </label>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">M-Pesa phone (recipient)</label>
        <input name="mpesa_phone" type="text" value="{{ landlord.phone if landlord and landlord.phone else '' }}" placeholder="2547XXXXXXXX" class="mt-1 block w-full rounded border-gray-300" />
        <p class="text-xs text-gray-500 mt-1">If left blank, we will use your saved phone number.</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Period month</label>
          <input name="period_month" type="number" min="1" max="12" value="{{ current_month }}" class="mt-1 block w-full rounded border-gray-300" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Period year</label>
          <input name="period_year" type="number" min="2000" max="2100" value="{{ current_year }}" class="mt-1 block w-full rounded border-gray-300" />
        </div>
      </div>

      <div class="pt-4">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">File tax & Withdraw</button>
      </div>
    </form>
  </div>
{% endblock %}
